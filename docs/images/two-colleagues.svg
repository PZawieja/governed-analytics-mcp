<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
<title id="t">Same question, two colleagues, different answers</title>
<desc id="d">Emma, who runs Oregon, and Jake, from finance, both ask the agent for October 2026 revenue by region. The server sends identical SQL for both. Emma gets one row, Oregon at $680,000; Washington and California are filtered out by Postgres row-level security. Jake gets all three: California $870,000, Oregon $680,000, Washington $1,150,000.</desc>
<defs><style>
.sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
</style>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a5750"/></marker>
</defs>
<rect width="1200" height="620" rx="24" fill="#0d0d0f"/>
<rect x="1" y="1" width="1198" height="618" rx="23" fill="none" stroke="#2a2924" stroke-width="2"/>

<text x="54" y="62" class="mono" font-size="15" fill="#c8a96e" letter-spacing="3">COPPER KETTLE COFFEE · OCTOBER 2026</text>
<text x="54" y="108" class="sans" font-size="34" font-weight="700" fill="#f0ece4">Same question. Same SQL. Different answers.</text>
<text x="54" y="144" class="sans" font-size="18" fill="#9a958a">The agent asks. Postgres decides what each person may see, as it does for their dashboards.</text>

<g transform="translate(400 176)">
  <rect width="400" height="58" rx="29" fill="#151517" stroke="#c8a96e" stroke-width="2"/>
  <text x="200" y="36" text-anchor="middle" class="sans" font-size="19" fill="#f0ece4">“Revenue by region, October 2026”</text>
</g>
<path d="M520 236 L330 290" stroke="#5a5750" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M680 236 L870 290" stroke="#5a5750" stroke-width="2" fill="none" marker-end="url(#a)"/>

<g transform="translate(54 300)">
  <rect width="520" height="270" rx="16" fill="#151517" stroke="#2a2924"/>
  <text x="28" y="44" class="sans" font-size="21" font-weight="700" fill="#f0ece4">Emma</text>
  <text x="100" y="44" class="sans" font-size="17" fill="#9a958a">runs Oregon</text>
  <text x="492" y="44" text-anchor="end" class="mono" font-size="14" fill="#9a958a">SET LOCAL ROLE emma</text>
  <line x1="28" y1="64" x2="492" y2="64" stroke="#2a2924" stroke-width="2"/>
  <g class="mono" font-size="20">
    <text x="28" y="110" fill="#f0ece4">Oregon</text><text x="492" y="110" text-anchor="end" fill="#f0ece4">$680,000</text>
    <text x="28" y="160" fill="#4a4842">California</text><text x="492" y="160" text-anchor="end" fill="#4a4842">not hers</text>
    <text x="28" y="210" fill="#4a4842">Washington</text><text x="492" y="210" text-anchor="end" fill="#4a4842">not hers</text>
  </g>
  <line x1="28" y1="153" x2="148" y2="153" stroke="#4a4842" stroke-width="2"/>
  <line x1="28" y1="203" x2="148" y2="203" stroke="#4a4842" stroke-width="2"/>
  <text x="28" y="248" class="sans" font-size="16" fill="#7a9e7e">1 row · filtered by row-level security</text>
</g>

<g transform="translate(626 300)">
  <rect width="520" height="270" rx="16" fill="#151517" stroke="#2a2924"/>
  <text x="28" y="44" class="sans" font-size="21" font-weight="700" fill="#f0ece4">Jake</text>
  <text x="88" y="44" class="sans" font-size="17" fill="#9a958a">finance, all regions</text>
  <text x="492" y="44" text-anchor="end" class="mono" font-size="14" fill="#9a958a">SET LOCAL ROLE jake</text>
  <line x1="28" y1="64" x2="492" y2="64" stroke="#2a2924" stroke-width="2"/>
  <g class="mono" font-size="20" fill="#f0ece4">
    <text x="28" y="110">Oregon</text><text x="492" y="110" text-anchor="end">$680,000</text>
    <text x="28" y="160">California</text><text x="492" y="160" text-anchor="end">$870,000</text>
    <text x="28" y="210">Washington</text><text x="492" y="210" text-anchor="end">$1,150,000</text>
  </g>
  <text x="28" y="248" class="sans" font-size="16" fill="#7a9e7e">3 rows · Jake may see every region</text>
</g>
</svg>
